[package]
name = "client-tauri"
version.workspace = true
edition.workspace = true

[lib]
name = "client_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
aec3 = "0.4.0"
async-trait = "0.1.92"
bytes = "1.12.1"
cpal = { version = "0.18", optional = true, features = ["pulseaudio"] }
fastrand = "2.5.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
nnnoiseless = { version = "0.5.2", default-features = false }
opus-pure = "0.2"
protocol = { version = "0.1.0", path = "../../protocol" }
rtc = "0.20.5"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-notification = "2.4.0"
tauri-plugin-single-instance = "2.4.4"
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["connect", "rustls-tls-webpki-roots"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["serde", "v4"] }
webrtc = "0.20.5"

# Push-to-talk through the GlobalShortcuts portal on Wayland (specs/0013).
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "global_shortcuts"] }

[build-dependencies]
tauri-build = "2.6.3"

[dev-dependencies]
axum = "0.8.9"
futures-util = "0.3.34"
serde_json = "1.0.151"
signaling-server = { path = "../../signaling-server" }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full", "test-util"] }

[features]
default = ["audio-device"]
# Real sound through cpal; needs ALSA headers on Linux (specs/0011).
audio-device = ["dep:cpal"]
# Serves the frontend from the binary instead of the dev server. Tauri reads
# this as "not a dev build" (`dev = !custom-protocol` in its build script), so
# a release build without it shows an empty window unless `trunk serve` runs.
# `cargo tauri build` passes it; a plain cargo build has to ask for it.
custom-protocol = ["tauri/custom-protocol"]
