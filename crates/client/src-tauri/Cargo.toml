[package]
name = "client-tauri"
version.workspace = true
edition.workspace = true

[lib]
name = "client_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
protocol = { version = "0.1.0", path = "../../protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = "2.11.5"

[build-dependencies]
tauri-build = "2.6.3"
