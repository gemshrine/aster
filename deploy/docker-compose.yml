name: aster

services:
  signaling-server:
    # Auto deploy pulls this tag from GHCR; `up -d --build` still builds
    # locally (specs/0014-auto-deploy.md).
    image: ghcr.io/gemshrine/aster-signaling-server:${ASTER_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      ASTER_USERS: ${ASTER_USERS:?set ASTER_USERS in deploy/.env}
      TURN_HOST: ${ASTER_DOMAIN:?set ASTER_DOMAIN in deploy/.env}
      TURN_SECRET: ${TURN_SECRET:?set TURN_SECRET in deploy/.env}
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - signaling-server
    environment:
      ASTER_DOMAIN: ${ASTER_DOMAIN:?set ASTER_DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  coturn:
    image: coturn/coturn:4
    restart: unless-stopped
    # TURN relays media on a UDP port range and must see real client addresses;
    # host networking avoids pushing that range through Docker's NAT.
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --realm=${ASTER_DOMAIN}
      - --static-auth-secret=${TURN_SECRET:?set TURN_SECRET in deploy/.env}

volumes:
  caddy_data:
  caddy_config:
