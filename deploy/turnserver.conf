# realm and static-auth-secret are passed on the command line from deploy/.env.

listening-port=3478
# Small relay range: two users, at most one call.
min-port=49160
max-port=49200

use-auth-secret
fingerprint
no-cli
no-multicast-peers
# Plain TURN only; media is DTLS-SRTP end to end regardless (specs/0007).
no-tls
no-dtls

# Never relay to private or loopback addresses on the VPS itself.
no-loopback-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

log-file=stdout
simple-log
